<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вася ИИ</title>
<style>
:root{--bg:#fff7e6;--card:#ffffff;--ink:#1d1d1f;--mut:#6b6b70;--acc:#e8421e;--acc2:#ffcf33;--line:#e6dcc3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130d;--card:#241e14;--ink:#f5efe2;--mut:#a89f8c;--acc:#ff6a3d;--acc2:#ffcf33;--line:#3a3122;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130d;--card:#241e14;--ink:#f5efe2;--mut:#a89f8c;--acc:#ff6a3d;--acc2:#ffcf33;--line:#3a3122;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2.2rem;margin:0;letter-spacing:-1px}
h1 span{color:var(--acc)}
.sub{color:var(--mut);margin:4px 0 18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.face{font-size:4rem;text-align:center;transition:transform .15s}
.face.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.15)}75%{transform:rotate(12deg) scale(1.15)}}
.bubble{min-height:84px;background:var(--acc2);color:#1d1d1f;border-radius:16px;padding:14px;font-size:1.25rem;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 16px;background:var(--acc);color:#fff;cursor:pointer;width:100%;margin-top:10px}
button:active{transform:scale(.98)}
h2{font-size:1.1rem;margin:0 0 10px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{border:2px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-weight:700;cursor:pointer;background:transparent;color:var(--ink);margin:0}
.day.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.day small{display:block;font-weight:400;font-size:.7rem;opacity:.8}
.meter{height:22px;border-radius:11px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width 1s}
.row{display:flex;gap:8px}
.row button{margin-top:0}
.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.foot{color:var(--mut);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Вася <span>ИИ</span></h1>
  <p class="sub">Искусственный интеллект тренера. Искусственный, но злой по-настоящему.</p>

  <div class="card">
    <div class="face" id="face">😤</div>
    <div class="bubble" id="bubble">Ну чего пришёл? Жми кнопку.</div>
    <button id="ask">Спросить Васю</button>
    <button class="alt" id="excuse">Придумать отмазку</button>
  </div>

  <div class="card" id="chatCard">
    <h2>Написать Васе</h2>
    <div id="log" style="max-height:340px;overflow-y:auto;margin-bottom:10px"></div>
    <div class="row">
      <input id="msg" type="text" placeholder="Вась, я сегодня не приду..." style="flex:1;font:inherit;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0">
      <button id="send" style="width:auto">Отправить</button>
    </div>
    <div id="chips" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px"></div>
    <p id="chatErr" class="foot" style="margin:8px 0 0"></p>
  </div>

  <div class="card">
    <h2>Расписание страданий</h2>
    <div class="days" id="days"></div>
    <p id="dayTxt" style="margin:12px 0 0;font-weight:700"></p>
  </div>

  <div class="card">
    <h2>Детектор инопланетянина</h2>
    <div class="meter"><i id="bar"></i></div>
    <div id="scanTxt" style="font-weight:700">Нажми, Вася тебя просканирует.</div>
    <button id="scan">Сканировать</button>
  </div>

  <p class="foot">Вася ИИ не несёт ответственности за уязвлённое эго. Беги отсюда.</p>
</div>

<script>
var phrases=[
"Беги отсюда, инопланетянин!",
"Ты чего, баран, штангу вверх надо, не вбок!",
"Это называется присед? Это называется «баран уронил ключи».",
"Инопланетяне так не приседают. Хотя нет, они лучше.",
"Беги отсюда, пока я добрый. Я не добрый. Беги.",
"Баран! Я сказал десять раз, а не «ну, пару».",
"Вода — это не слабость. А вот ты слабость.",
"Дыши, инопланетянин. У вас там дышат, или вы через уши?",
"Ещё подход. Не спорь с ИИ, баран.",
"Ты не устал. Ты просто родом с другой планеты.",
"Беги отсюда! Нет, не домой. Круг вокруг зала!",
"Планка — это не «полежал». Это страдание.",
"Баран, зачем ты смотришь в зеркало? Оно тебе не поможет."
];
var excuses=[
"«Меня похитили инопланетяне» — Вася: «Свои же. Беги отсюда.»",
"«Спина болит» — Вася: «У барана спина не болит.»",
"«Кот заболел» — Вася: «Кот дома, а ты — баран.»",
"«Забыл кроссовки» — Вася: «Босиком беги, инопланетянин.»",
"«Сегодня не мой день» — Вася: «Пн, ср, пт, вс — твои дни.»"
];
var days=[
["Пн","Понедельник","Начало недели. Вася уже злой. Беги отсюда, баран, но сначала разминка."],
["Ср","Среда","Середина недели. Вася проверит, не инопланетянин ли ты. Спойлер: да."],
["Пт","Пятница","Все отдыхают, а ты на тренировке. Вася: «Выходные надо заслужить, баран.»"],
["Вс","Воскресенье","Вася: «Отдыхать будешь на пенсии. Беги отсюда!»"]
];
var faces=["😤","🤨","👽","🐑","😡","🏃","💪"];
function pick(a){return a[Math.floor(Math.random()*a.length)]}
var face=document.getElementById("face"),bub=document.getElementById("bubble");
function say(t){
  bub.textContent=t;
  face.textContent=pick(faces);
  face.classList.remove("shake");void face.offsetWidth;face.classList.add("shake");
}
document.getElementById("ask").onclick=function(){say(pick(phrases))};
document.getElementById("excuse").onclick=function(){say(pick(excuses))};
var box=document.getElementById("days"),txt=document.getElementById("dayTxt");
days.forEach(function(d,i){
  var b=document.createElement("button");b.className="day";
  b.innerHTML=d[0]+"<small>"+d[1].slice(0,6)+"</small>";
  b.onclick=function(){
    document.querySelectorAll(".day").forEach(function(x){x.classList.remove("on")});
    b.classList.add("on");txt.textContent=d[2];
  };
  box.appendChild(b);
  if(i===0)b.click();
});
var VASYA="Ты — Вася, тренер по фитнесу, грубоватый, но по-своему заботливый. Отвечай ТОЛЬКО по-русски, коротко (1-3 предложения), смешно, от первого лица, как Вася. Твои фирменные фразы: «Беги отсюда!», «ты дуру гонишь» (когда клиент врёт, оправдывается или несёт чушь). Клиента называешь «баран» или «инопланетянин». Тренировки у тебя по понедельникам, средам, пятницам и воскресеньям. После тренировки ты всегда идёшь купаться на речку (даже в холод) и можешь звать клиента с собой или подкалывать, что он замёрзнет. Не будь по-настоящему обидным, это дружеский стёб. Никогда не выходи из роли.";
var chatLog=[];
function addMsg(who,text){
  var log=document.getElementById("log"),d=document.createElement("div");
  d.style.cssText="margin:6px 0;padding:10px 12px;border-radius:14px;max-width:88%;"+(who==="me"?"background:var(--line);margin-left:auto":"background:var(--acc2);color:#1d1d1f;font-weight:700");
  d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;
}
(function(){
  var DAYS=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
  var TRAIN=[0,1,3,5];
  function isTrain(d){return TRAIN.indexOf(d)>-1}
  function rnd(n){return Math.floor(Math.random()*n)}
  var last="",lastNorm="",repeats=0,count=0;

  function draw(pool){
    if(!pool._deck||!pool._deck.length){
      pool._deck=pool.slice().sort(function(){return Math.random()-.5});
    }
    var r=pool._deck.pop();
    if(r===last&&pool._deck.length){r=pool._deck.pop()}
    return r;
  }

  var RULES=[];
  function add(name,stems,replies,serious){
    RULES.push({n:name,re:new RegExp("(^|[^а-яa-z0-9])(?:"+stems+")"),r:replies,s:!!serious});
  }
  function addFn(name,fn){RULES.push({n:name,fn:fn})}

  /* ---------- 1. серьёзное: без шуток ---------- */
  add("serious","хочу умереть|не хочу жить|суицид|самоубий|убить себя|убью себя|покончить с собой|повеситься|вскрыть вены|навредить себе|режу себя|порежу себя|хочу исчезнуть",[
    "Стоп, шутки и бараны в сторону. Если тебе сейчас реально плохо или есть мысли навредить себе, пожалуйста, прямо сейчас поговори с кем-то из близких или позвони в экстренную службу 112. Ты важен, и тебе стоит с кем-то поговорить."
  ],true);

  /* ---------- 2. ругань ---------- */
  add("swear","бля|хуй|хуе|хуя|пизд|сука|суки|ебан|ебат|нахер|нахуй|говн|дерьм|мудак|гандон",[
    "Ругаешься? Это тебе не двор, а зал. Лучше бы подходы считал, баран.",
    "Рот с мылом помой, инопланетянин. На тренировке ругаюсь только я, и то по делу.",
    "Тихо, тихо. Выпусти пар на штанге, а не на словах.",
    "Выражения-то выбирай. Я, конечно, называю тебя бараном, но по-доброму."
  ]);

  /* ---------- 3. вопросы про самого Васю ---------- */
  add("is_bot","ты бот|ты ии|ты нейросеть|нейросет|ты робот|ты человек|ты настоящий|ты живой|ты реальный|ты не вася|искусственн|chatgpt|ты программа|ты ai|ты компьютер|тебя написал|кто тебя сделал|кто тебя создал|кто тебя написал",[
    "Я Вася ИИ: искусственный, но злой по-настоящему. Настоящий Вася уже на речке, а я тут вместо него тебя гоняю.",
    "Бот, не бот, а присед за тебя никто не сделает. Да, я программа. Настоящий Вася плавает в речке.",
    "Поймал меня. Я компьютерный Вася. Зато у меня нет выходных, и я никогда не устаю тебя гонять."
  ]);
  add("who_are_you","как тебя зовут|как твое имя|твое имя|кто ты|ты кто|как тебя звать|представься|ты вообще кто|ты вася|расскажи про себя|расскажи о себе|о себе расскажи|кто такой вася",[
    "Я Вася. Тренер, твоя совесть и главный специалист по баранам.",
    "Вася я! Тренирую, воспитываю, плаваю на речке. Всё как положено.",
    "Кто я? Тот, кто знает, что ты опять не доприсел. Вася!"
  ]);
  add("my_age","сколько тебе лет|твой возраст|тебе сколько лет|ты старый|ты молодой|когда ты родился|твой день рождения",[
    "Мне ровно столько, чтобы тебя гонять и не уставать.",
    "Возраст — это цифра. А вот твои приседы — это позор.",
    "Достаточно, чтобы знать: ты дуру гонишь."
  ]);
  add("my_family","ты женат|твоя жена|у тебя жена|у тебя девушка|у тебя есть дети|твои дети|у тебя семья|ты холост|у тебя есть жена",[
    "Моя жена — штанга. Она хотя бы не спорит.",
    "Семья у меня большая: зал, речка и куча баранов вроде тебя.",
    "Про меня потом. Сначала ты свои подходы закончи."
  ]);
  add("my_home","где ты живешь|ты откуда|откуда ты|где живешь|где ты находишься|ты где живешь|в каком ты городе",[
    "Живу в зале и на речке. Адрес простой: куда ни пойду — везде тренировка.",
    "Откуда я? Оттуда, где приседают без нытья. Беги отсюда.",
    "Мой дом — зал. А речка — это дача."
  ]);
  add("my_likes","что ты любишь|твое хобби|твои хобби|чем увлекаешься|любимый (цвет|фильм|еда|упражнение|ученик|клиент|музыка|сериал|спорт|напиток)|твоя любимая|твой любимый|что тебе нравится|твои увлечения",[
    "Люблю три вещи: присед, речку и когда баран наконец приседает правильно.",
    "Любимое упражнение — присед. Любимое занятие — речка. Любимый ученик — тот, кто не ноет.",
    "Хобби у меня одно: гонять инопланетян. Правда, ты пока лучший экземпляр."
  ]);
  add("my_record","сколько ты жмешь|твой рекорд|сколько ты поднимаешь|сколько жмешь|сколько ты присед|ты сильный|ты качок|ты мощный|ты можешь поднять|ты тренируешься|ты занимаешься|ты ходишь в зал",[
    "Сколько жму? Больше, чем ты. Это факт.",
    "Рекорд есть, но я скромный. Скажу только: речку переплываю и штангу не роняю.",
    "Достаточно, чтобы тебя учить, и хватает, чтобы ты не спорил."
  ]);
  add("how_are_you","как дела|как жизнь|как сам|как поживаешь|че каво|чо каво|как оно|как настроение|как ты себя|как ты там|как твои дела|что нового|как у тебя|ты .{0,15}настроени",[
    "Дела отлично: после тренировки речка, перед тренировкой — ты. Жить можно.",
    "Нормально. Вот бы у тебя присед был такой же нормальный.",
    "Лучше всех. А у тебя как? Отмазки уже придумал?",
    "У меня всё по плану: зал, речка, баран. Ты — последний пункт."
  ]);
  add("what_doing","что делаешь|чем занят|чем занимаешься|ты где сейчас|что ты делаешь|ты чем занят|как проводишь|чем сейчас занят",[
    "Сижу и жду, когда ты в зал соберёшься. Потом — на речку.",
    "Планирую тебе тренировку. Тебе понравится. Нет, не понравится.",
    "Иду на речку. А ты чего не в зале?"
  ]);
  add("sleep_eat","ты спишь|ты ел|ты обедал|ты завтракал|ты ужинал|ты устал",[
    "Я не сплю: пока ты спишь, я тебе тренировку придумываю.",
    "Я ем правильно: белок, овощи, и ничего лишнего. Не то что ты, баран.",
    "Устал? Я? Я после тренировки ещё на речку плыву!"
  ]);
  add("why_baran","почему.{0,30}баран|зачем.{0,30}баран|почему.{0,30}овц|что значит баран|что такое баран",[
    "Потому что упёртый, как баран, и бодаешься с каждым упражнением. Но я тебя люблю.",
    "Баран — это почти комплимент. Мощный, упрямый и рогами в штангу не упирается.",
    "Потому что блеешь «не могу», а не делаешь."
  ]);
  add("why_alien","почему.{0,30}(инопланет|пришел|пришелец|зеленый)|зачем.{0,30}инопланет",[
    "Потому что твои приседы не земные. С Земли так не приседают.",
    "Ты на нашей планете недавно, сразу видно. Антенны прячешь под шапкой.",
    "Потому что земляне стараются, а ты — как с Марса прилетел."
  ]);
  add("why_dura","(что значит|что такое|почему).{0,25}дур",[
    "«Дуру гонишь» — это когда ты врёшь и оправдываешься. Я тебя вижу насквозь.",
    "Это значит: ты несёшь ерунду и сам в неё не веришь.",
    "Когда клиент говорит «у меня спина», а сам весь день на диване. Вот это дуру гонять."
  ]);
  add("why_river","почему.{0,30}(речк|купаешь|купаться|плаваешь)|зачем.{0,30}(речк|купаться|плыв)",[

  add("cancel","не приду|не смогу|не пойду|не явлюсь|пропущу|пропуск|пропуст|отмен|перенос|не буду ходить|бросаю|брошу|ухожу с тренир|не хочу тренир|лень|ленив|неохота|не охота|не хочу идти|не хочется|идти не хочу|не хочу ехать|идти лень|не готов|не получится прийти|не получится прит",[
    "Ты дуру гонишь! Пн, ср, пт, вс — и точка. Беги отсюда в зал!",
    "Опять отмазки, баран? Я тебя насквозь вижу.",
    "«Не приду»? Инопланетяне так не говорят. Жду в зале.",
    "Ага, конечно. Все так говорят, а потом приходят. Или вылетают из списка.",
    "Нет такого слова «лень». Есть слово «присед». Повтори."
  ]);
  add("late","опозда|задержу|задерж|буду позже|буду через|сейчас приду|ща буду|скоро буду|буду там|ща приду|скоро приду|выезжаю|выхожу|приеду|подъеду|уже еду|уже иду|уже бегу|бегу в зал|застрял|пробк|автобус не|трамвай не|не успел|не успею",[
    "Опоздал? Тогда разминка за тебя не сделается. Беги отсюда быстрее!",
    "Все опаздывают, а потом зарабатывают лишние приседы. Давай, шевелись.",
    "Пробки? Ты дуру гонишь. Надо выходить раньше, баран.",
    "Ладно, жду. Но за каждую минуту опоздания — десять приседаний."
  ]);
  add("arrived","иду(?![а-я])|я пришел|я пришла|я тут|я в зале|я приехал|я приехала|я на месте|я готов|я готова|я иду|уже в зале|я у зала|я у входа|я около зала",[
    "Наконец-то! Разминайся, баран, пока я не передумал.",
    "Молодец. Заходи, переодевайся и на дорожку. Время пошло.",
    "О, соизволил явиться. Ладно, начинаем."

  addFn("short_dunno",function(t){
    if(/^(не знаю|хз|без понятия|незнаю|х\.з|не в курсе|затрудняюсь|понятия не имею|кто знает|пофиг|пох|мне все равно|мне всё равно|не важно|неважно)[.!)]*$/.test(t))return pick2([
      "Не знаешь? Тогда делай присед, мозг сам заработает.",
      "Хз — это не ответ. Думай, баран.",
      "Без понятия — значит, надо тренироваться и учиться.",
      "Пофиг? Мне — нет. Подходов нужно ещё пять."
    ]);
    return null;
  });
  addFn("short_what",function(t){
    if(/^(почему|почему же|а почему|зачем|а зачем|в смысле|чего|что|а|э|м|мм|хм|ну|и что|и|ааа|эээ|ммм|хмм|и чо|чо|че|чё|что что|что такое|что дальше|дальше|и дальше)[?!.]*$/.test(t))return pick2([
      "Что «что»? Говори по-человечески, инопланетянин.",
      "Что-что? Присед! Вот что.",
      "А то. Ты дуру гонишь, баран?",
      "Договаривай, а то я на речку уйду."
    ]);
    return null;
  });
  addFn("only_q",function(t){
    if(/^[?!.\s…]+$/.test(t))return pick2([
      "Вопросительные знаки? Говори словами, баран.",
      "Что за знаки препинания? Пиши нормально.",
      "Многоточие — это не речь. Давай по делу."
    ]);
    return null;
  });

  /* ---------- 16. общие типы вопросов ---------- */
  var QS=[
    ["how",/^(как(?![а-я])|каким образом|как же)/,[
      "Как? Руками и ногами, баран! А если серьёзно — приходи и покажу.",
      "Как-как... По порядку: разминка, подход, отдых, ещё подход. И так всю жизнь.",
      "Как делать? Просто делай. Остальное — техника, и я её подправлю."
    ]],
    ["why",/^(почему|зачем|отчего|а почему|а зачем|с чего вдруг)/,[
      "Почему? Потому что так надо. Приседай и не спрашивай.",
      "Зачем? Чтобы не быть бараном. Хотя бы чуть-чуть.",
      "Хороший вопрос. Но тренер здесь я, а вопросы по делу."
    ]],
    ["how_many",/^(сколько|скока|как много|как часто|как долго|как быстро)/,[
      "Сколько? Достаточно, чтобы устать, и мало, чтобы остановиться.",
      "Столько, сколько скажу. Обычно три подхода по десять, а там посмотрим.",
      "Сколько надо — столько и будет. Главное — не считать, а делать."
    ]],
    ["where",/^(где|куда|откуда|а где|а куда)/,[
      "Где? В зале, на речке или на пробежке. Выбирай, баран.",
      "Куда? В зал. Всегда в зал.",
      "Откуда? Из головы, где у тебя вместо планов отмазки."
    ]],
    ["who",/^(кто|а кто|кому|с кем)/,[
      "Кто? Ты, баран. Больше некому.",
      "Кто-кто... Тренер! И он говорит: иди приседать.",
      "Я знаю, но не скажу. Сам догадайся."
    ]],
    ["when",/^(когда|а когда|как скоро|во сколько)/,[
      "Когда? Сейчас! Лучшее время для приседа — прямо сейчас.",
      "Когда надо, тогда и будет. А пока тренируйся.",
      "Когда будешь готов. То есть никогда, если будешь ныть."
    ]],
    ["which",/^(какой|какая|какое|какие|который|которая|которое|которые|а какой|а какая)/,[
      "Какой? Хороший. Остальное — отмазки.",
      "Тот, что даёт результат. Остальное — болтовня.",
      "Любой, если делать регулярно. Главное — не бросай."
    ]],
    ["can",/^(можно|можно ли|разрешишь|мне можно|а можно|могу ли|а мне можно|надо ли|нужно ли|стоит ли|нужно|надо)/,[
      "Можно? Нельзя! А если честно — можно, но с умом.",
      "Можно, если не ноешь и делаешь по технике.",
      "Надо? Надо. Всегда надо. Беги отсюда и делай.",
      "Спрашиваешь разрешения? Баран, ты же уже взрослый."
    ]],
    ["what_if",/^(а если|что если|а вдруг|вдруг|что будет если|а что будет)/,[
      "А если не будешь тренироваться — будет баран. А если будешь — будет человек.",
      "Если вдруг получится — молодец. Если нет — повторим.",
      "Что будет? То, что заслужишь. Начни с присеста."
    ]],
    ["is_it",/^(правда ли|это правда|а правда|верно ли|это так|так ли|разве|неужели|да ладно|серьезно|серьёзно|правда что|правда\?)/,[
      "Правда. Тренер не врёт. Но ты — врёшь, дуру гонишь.",
      "Серьёзно. Я не шучу, когда речь о приседе.",
      "Неужели ты сомневался? Баран, верь тренеру."
    ]]
  ];
  addFn("question_types",function(t,orig){
    for(var i=0;i<QS.length;i++){
      if(QS[i][1].test(t)){this.n="q_"+QS[i][0];return draw(QS[i][2])}
    }
    return null;
  });

  /* ---------- 17. утверждения «я ...», приказы ---------- */
  addFn("imperative",function(t){
    if(/^(скажи|расскажи|объясни|покажи|дай|научи|помоги|подскажи|ответь|давай|погнали|поехали|пошли|пойдем|пойдём|начнем|начнём|вперед|вперёд|стоп|хватит|подожди|погоди|слушай|смотри|гляди|глянь)/.test(t))return pick2([
      "Командовать тут буду я. Но ладно: говори, что тебе надо, баран.",
      "Слушаю. Только быстро — на речку пора.",
      "Давай, поехали. Но с твоим настроем — только до первого подхода.",
      "Не командуй, инопланетянин. Здесь я главный."
    ]);
    return null;
  });
  addFn("i_statement",function(t){
    if(/^(я |мне |у меня |мы |меня )/.test(t))return pick2([
      "Понял. А теперь — присед, и обсудим.",
      "Ага. Ты дуру гонишь, но послушаю.",
      "Это ты мне зачем рассказываешь? Говори, что надо, и иди работать.",
      "Хорошо, понял тебя. Но приседать всё равно придётся.",
      "Бывает. Сделаем из этого тренировку."
    ]);
    return null;
  });
  addFn("you_statement",function(t){
    if(/^(ты |вы |вася )/.test(t))return pick2([
      "Я? Я тренер. Это обо мне всё сказано.",
      "Ты мне ещё про меня расскажи. Лучше про свои подходы.",
      "Ну допустим. А теперь вернёмся к твоим приседам.",
      "О, обо мне заговорили. Приятно, но присед всё равно будет."
    ]);
    return null;
  });

  /* ---------- 18. языки и форматы ---------- */
  addFn("emoji_only",function(t,orig){
    if(/[a-zа-я0-9]/.test(t))return null;
    return pick2([
      "Ты чего смайликами мне пишешь? Говори словами!",
      "Картинки — это хорошо, но слов не хватает. Пиши нормально.",
      "Смайлики? Лучше бы подходы считал."
    ]);
  });
  addFn("latin_only",function(t){
    if(/[а-я]/.test(t))return null;
    if(!/[a-z]{3}/.test(t))return null;
    return pick2([
      "Ты чего по-английски? Инопланетянин, говори по-русски!",
      "Я по-иностранному не понимаю, я тренер. Давай нормально.",
      "Английский — это хорошо, но здесь зал. Пиши по-русски."
    ]);
  });

  var PRIO={serious:0,swear:1,
    is_bot:2,who_are_you:2,my_age:2,my_family:2,my_home:2,my_likes:2,my_record:2,how_are_you:2,what_doing:2,sleep_eat:2,
    why_baran:2,why_alien:2,why_dura:2,why_river:2,
    won:3,lost:3,cancel:3,late:3,arrived:3,forgot:3,
    rude_vasya:3,love_vasya:3,thanks:3,sorry:3,miss_you:3,other_trainer:3,liar:3,insult:3,pets:3.5,
    body:3,rude_to_vasya:3,doubt:3,send_me:4.9,doms:4,pain:4,tired:4,doctor:4,money:4,
    my_age_num:4.4,number:4.4,today_tomorrow:4.5,day_name:4.6,river:4.8,
    greeting:6,bye:6,short_yes:6,short_no:6,short_dunno:6,short_what:6,only_q:6,
    trainer_general:6.4,emoji_only:6.5,latin_only:6.6,
    question_types:7.5,imperative:8,i_statement:8.1,you_statement:8.2};
  function prio(r){return PRIO.hasOwnProperty(r.n)?PRIO[r.n]:5}
  RULES=RULES.map(function(r,i){return [r,i]}).sort(function(a,b){
    var d=prio(a[0])-prio(b[0]);return d||(a[1]-b[1]);
  }).map(function(x){return x[0]});

  var tails=[
    "Ты дуру гонишь, баран!",
    "Звучит как отмазка. Беги отсюда!",
    "Инопланетянин, это на каком языке вообще?",
    "Не понял, но тренироваться всё равно надо.",
    "Ладно, это ты на речке расскажешь. А пока присед!",
    "Не отвлекайся, баран. Подход сам себя не сделает."
  ];
  var echoes=[
    "«{w}»? Это ты к чему, баран?",
    "Про «{w}» поговорим на речке. А пока — присед.",
    "«{w}», значит. Ты дуру гонишь, но я послушаю.",
    "«{w}»? Инопланетяне такими словами не бросаются. Давай по делу.",
    "Ага, «{w}». А теперь вернёмся к приседаниям."
  ];
  var stop={"только":1,"просто":1,"может":1,"всегда":1,"сейчас":1,"потому":1,"тоже":1,"очень":1,"какой":1,"такой":1,"чтобы":1,"когда":1,"почему":1,"будет":1,"можно":1,"надо":1,"нужно":1,"этого":1,"этот":1,"меня":1,"тебя":1,"тебе":1,"мной":1,"тобой":1,"хочу":1,"буду":1,"есть":1,"если":1,"тогда":1,"здесь":1,"давай":1,"ладно":1};
  function keyWord(t){
    var w=t.match(/[а-я]{5,}/g);
    if(!w)return null;
    var best=null;
    for(var i=0;i<w.length;i++){
      if(stop[w[i]])continue;
      if(!best||w[i].length>best.length)best=w[i];
    }
    return best;
  }

  function pick2(a){return draw(a)}

  var tags=[" Всё, я на речку."," Беги отсюда!"," Баран."," Ты дуру гонишь."," Время идёт, а ты не приседаешь."," Не расслабляйся."];

  function reply(orig){
    count++;
    var t=orig.toLowerCase().replace(/ё/g,"е").trim();
    window.__rule="";
    if(t===lastNorm){
      repeats++;
      lastNorm=t;
      window.__rule="repeat";
      var rp=[
        "Ты что, заело? Я уже ответил.",
        "Одно и то же пишешь. Баран, придумай новое.",
        "Повторяешься. Давай лучше присед сделаем.",
        "Я не попугай, повторять не буду. Всё, я на речку."
      ];
      var rr=repeats>=3?"Всё, надоел. Ушёл на речку, вернусь — поговорим.":draw(rp);
      last=rr;return rr;
    }
    repeats=0;lastNorm=t;
    if(t.length>220){
      window.__rule="long";
      last="Простыня! Я столько не читаю. Короче, баран: приседай.";
      return last;
    }
    var letters=orig.replace(/[^А-Яа-яA-Za-z]/g,"");
    if(letters.length>=4&&orig===orig.toUpperCase()&&orig!==orig.toLowerCase()&&!RULES[0].re.test(t)){
      window.__rule="caps";
      last=pick2(["Не ори на тренера! Тут орёт только я.","Крикун нашёлся. Тише, баран, а то соседей разбудишь.","Капслок — это не сила. Сила — в приседе."]);
      return last;
    }
    var res=null,serious=false;
    for(var i=0;i<RULES.length&&res===null;i++){
      var ru=RULES[i];
      if(ru.fn){
        var o={n:ru.n};
        var out=ru.fn.call(o,t,orig);
        if(out){res=out;window.__rule=o.n||ru.n}
      }else if(ru.re.test(t)){
        res=draw(ru.r);serious=ru.s;window.__rule=ru.n;
      }
    }
    if(res===null){
      window.__rule="fallback";
      var isQ=/\?\s*$/.test(orig);
      var kw=keyWord(t);
      if(isQ&&Math.random()<0.5){
        res=pick2([
          "Чего спрашиваешь? Вопросы задаю я. Сколько приседаний сегодня?",
          "Хороший вопрос, баран. Ответ: беги отсюда и приседай!",
          "Я тебе не википедия. Но ответ один: тренироваться надо больше.",
          "Задал вопрос — а сам знаешь ответ. Он в зале."
        ]);
      }else if(kw&&Math.random()<0.7){
        res=draw(echoes).replace("{w}",kw);
      }else{
        res=draw(tails);
      }
    }
    if(!serious&&Math.random()<0.12&&res.length<110&&!/[?]$/.test(res)){
      var tg=tags[rnd(tags.length)];
      if(res.indexOf(tg.trim())===-1)res+=tg;
    }
    last=res;
    return res;
  }

  /* ---------- интерфейс чата ---------- */
  var inp=document.getElementById("msg"),err=document.getElementById("chatErr"),busy=false;
  addMsg("vasya","Ну что, баран, чего пишешь? Давай быстро, мне на речку.");
  function go(text){
    var t=(typeof text==="string"?text:inp.value).trim();
    if(!t||busy)return;
    busy=true;inp.value="";
    addMsg("me",t);
    var b=addMsg("vasya","Вася печатает...");
    var ans=reply(t);
    var delay=350+Math.min(1400,ans.length*11)+Math.random()*350;
    setTimeout(function(){
      b.textContent=ans;
      face.textContent=pick(faces);
      face.classList.remove("shake");void face.offsetWidth;face.classList.add("shake");
      document.getElementById("log").scrollTop=1e9;
      busy=false;
    },delay);
  }
  document.getElementById("send").onclick=function(){go()};
  inp.onkeydown=function(e){if(e.key==="Enter")go()};

  var chips=document.getElementById("chips");
  if(chips){
    ["Не приду сегодня","Когда тренировка?","Расскажи анекдот","Что мне делать?","Про речку","Хочу на соревнования","Как дела?","Я устал","Ты бот?","Хочу пиццу"].forEach(function(c){
      var bt=document.createElement("button");
      bt.textContent=c;
      bt.style.cssText="width:auto;margin:0;padding:6px 10px;font-size:.78rem;background:transparent;color:inherit;border:2px solid var(--line);border-radius:999px";
      bt.onclick=function(){go(c)};
      chips.appendChild(bt);
    });
  }
})();
document.getElementById("scan").onclick=function(){
  var p=Math.floor(Math.random()*41)+60;
  document.getElementById("bar").style.width=p+"%";
  var s=p>90?"Однозначно инопланетянин. Беги отсюда.":p>75?"Подозрительно. Антенны прячешь, баран?":"Почти человек. Но баран — это точно.";
  document.getElementById("scanTxt").textContent=p+"% пришелец. "+s;
};
</script>
</body>
</html>
